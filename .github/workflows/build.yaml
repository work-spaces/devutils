name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "spaces target to build (e.g. //devutils:install)"
        required: true
        type: string
      extra-checkout-args:
        description: Extra checkout args
        required: false
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: macos-13
          - runner: windows-2022
          - runner: ubuntu-22.04
          - runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: work-spaces/spaces-checkout-run@v0.21.3
        with:
          checkout: --url=https://github.com/work-spaces/devutils --rev=${{ github.ref_name }} ${{ inputs.extra-checkout-args }}
          run: ${{ inputs.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
